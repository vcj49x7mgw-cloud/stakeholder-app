
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stakeholder Report V9 Workshop</title>
<style>
  :root{
    --ui-blue:#0f4c81;
    --ui-blue-2:#1968a5;
    --ui-blue-3:#d9ebf7;
    --ui-bg:#f5f9fc;
    --ui-card:#ffffff;
    --ui-line:#c9dceb;
    --ui-text:#16324a;
    --ui-muted:#5f7b93;
    --ui-green:#57b884;
    --ui-yellow:#e8b949;
    --ui-red:#d76a6a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--ui-bg);
    color:var(--ui-text);
  }
  .topbar{
    background:linear-gradient(135deg,var(--ui-blue),var(--ui-blue-2));
    color:#fff;
    padding:24px 20px;
  }
  .topbar h1{margin:0 0 6px 0; font-size:26px}
  .topbar p{margin:0; opacity:.92}
  .wrap{padding:18px; max-width:1200px; margin:0 auto}
  .controls{
    background:var(--ui-card);
    border:1px solid var(--ui-line);
    border-radius:16px;
    padding:18px;
    box-shadow:0 8px 24px rgba(15,76,129,.08);
  }
  .row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
  input[type=file]{
    padding:10px;
    background:#fff;
    border:1px solid var(--ui-line);
    border-radius:10px;
    flex:1 1 320px;
  }
  button{
    border:none;
    border-radius:10px;
    padding:12px 16px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--ui-blue); color:#fff}
  .btn-secondary{background:var(--ui-blue-3); color:var(--ui-text)}
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-top:14px;
  }
  .stat{
    background:#fff;
    border:1px solid var(--ui-line);
    border-radius:14px;
    padding:14px;
  }
  .stat .k{font-size:12px; color:var(--ui-muted); margin-bottom:8px}
  .stat .v{font-size:28px; font-weight:800}
  .log{
    margin-top:14px;
    background:#fff;
    border:1px solid var(--ui-line);
    border-radius:14px;
    padding:12px 14px;
    color:var(--ui-text);
    min-height:78px;
    white-space:pre-line;
  }

  /* Report pages */
  #report{display:none}
  .page{
    width:297mm;
    min-height:210mm;
    background:#fff;
    color:var(--ui-text);
    padding:14mm 14mm 12mm 14mm;
    page-break-after:always;
    position:relative;
  }
  .page:last-child{page-break-after:auto}
  .page-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:2px solid var(--ui-blue-3);
    padding-bottom:8mm;
    margin-bottom:8mm;
  }
  .page-title{
    font-size:24px;
    line-height:1.1;
    font-weight:800;
    color:var(--ui-blue);
  }
  .page-sub{
    font-size:12px;
    color:var(--ui-muted);
    margin-top:4px;
  }
  .badge{
    background:var(--ui-blue-3);
    color:var(--ui-blue);
    padding:8px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
  }
  .two-col{
    display:grid;
    grid-template-columns:1.35fr .9fr;
    gap:10mm;
  }
  .three-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6mm;
  }
  .card{
    background:#fff;
    border:1px solid var(--ui-line);
    border-radius:14px;
    padding:14px;
  }
  .card h3{
    margin:0 0 8px 0;
    color:var(--ui-blue);
    font-size:15px;
  }
  .small{font-size:12px; color:var(--ui-muted)}
  .big{font-size:30px; font-weight:800}
  .summary p{margin:0 0 8px 0; font-size:15px; line-height:1.4}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }
  th{
    text-align:left;
    color:var(--ui-blue);
    border-bottom:2px solid var(--ui-line);
    padding:8px 6px;
  }
  td{
    border-bottom:1px solid #e6eef5;
    padding:7px 6px;
    vertical-align:top;
  }
  .prio-A{font-weight:800; color:var(--ui-blue)}
  .prio-B{font-weight:700; color:#7a5c15}
  .prio-C{font-weight:700; color:var(--ui-muted)}

  .viz-wrap{
    display:grid;
    grid-template-columns:1.2fr .7fr;
    gap:8mm;
    align-items:start;
  }
  .viz-box{
    border:1px solid var(--ui-line);
    border-radius:16px;
    padding:10px;
    background:#fff;
  }
  .legend-box{
    border:1px solid var(--ui-line);
    border-radius:16px;
    padding:12px;
    background:#fff;
    max-height:145mm;
    overflow:hidden;
  }
  .legend-box h3{margin:0 0 8px 0; color:var(--ui-blue)}
  .legend-item{
    font-size:12px;
    line-height:1.45;
    margin-bottom:3px;
  }
  .org-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6mm;
  }
  .org-col h3{
    margin:0 0 8px 0;
    color:var(--ui-blue);
    font-size:15px;
  }
  .org-node{
    border:1px solid var(--ui-line);
    border-left:6px solid var(--ui-blue);
    border-radius:12px;
    padding:10px 11px;
    margin-bottom:6px;
    background:#fff;
  }
  .org-name{font-weight:800; margin-bottom:3px}
  .org-role{font-size:12px; color:var(--ui-muted)}
  .org-boss{font-size:11px; color:var(--ui-muted); margin-top:4px}

  .footer-note{
    position:absolute;
    bottom:8mm;
    left:14mm;
    right:14mm;
    color:var(--ui-muted);
    font-size:10px;
    display:flex;
    justify-content:space-between;
  }
  .pill{
    display:inline-block;
    border-radius:999px;
    padding:3px 8px;
    font-size:11px;
    font-weight:700;
    background:#eef6fb;
    color:var(--ui-blue);
  }
  .att-positiv{color:var(--ui-green); font-weight:700}
  .att-neutral{color:var(--ui-yellow); font-weight:700}
  .att-kritisch{color:var(--ui-red); font-weight:700}
  .role-head{
    margin:0 0 6mm 0;
    color:var(--ui-blue);
    font-size:20px;
    font-weight:800;
  }
  .role-sub{
    color:var(--ui-muted);
    margin-bottom:6mm;
  }
  .stb-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7mm;
  }
  .stb{
    border:1px solid var(--ui-line);
    border-radius:16px;
    padding:12px;
    background:#fff;
    min-height:70mm;
  }
  .stb h3{margin:0 0 6px 0; color:var(--ui-blue)}
  .stb p{margin:0 0 6px 0; font-size:12px; line-height:1.4}
  @page{
    size:A4 landscape;
    margin:0;
  }
  @media print{
    body{background:#fff}
    .topbar,.wrap{display:none !important}
    #report{display:block !important}
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>Stakeholder Analyse V9</h1>
    <p>Workshop-Report mit Gesamtübersicht, Organigramm und Rollenperspektiven SVD / MVD / VVD / PVD</p>
  </div>

  <div class="wrap">
    <div class="controls">
      <div class="row">
        <input id="fileInput" type="file" accept=".xlsx,.xls" />
        <button class="btn-primary" onclick="processFile()">Datei prüfen</button>
        <button class="btn-secondary" onclick="preparePdf()">PDF erzeugen</button>
      </div>

      <div class="stats">
        <div class="stat"><div class="k">Stakeholder gesamt</div><div class="v" id="statTotal">–</div></div>
        <div class="stat"><div class="k">Priorität A</div><div class="v" id="statA">–</div></div>
        <div class="stat"><div class="k">Kritische Hoch-Einfluss-Personen</div><div class="v" id="statCritical">–</div></div>
        <div class="stat"><div class="k">Version</div><div class="v" style="font-size:18px">V9 WORKSHOP</div></div>
      </div>

      <div class="log" id="log">Bereit. Version V9 WORKSHOP.</div>
    </div>
  </div>

  <div id="report"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    let rowsData = [];
    let enriched = [];
    let uniqueCodeMap = new Map();

    const logEl = document.getElementById('log');
    const log = (msg) => { logEl.textContent += "\\n" + msg; };

    function normalize(s){
      return String(s || "")
        .toLowerCase()
        .replace(/[–—]/g, "-")
        .replace(/[^a-z0-9äöüß]/g, "");
    }

    function mapHeader(raw){
      const n = normalize(raw);
      if(n.includes("vorname")) return "vorname";
      if(n.includes("nachname")) return "nachname";
      if(n === "name" || n.includes("vollname")) return "name";
      if(n.includes("position") || n.includes("titel") || n.includes("rolle")) return "role";
      if(n.includes("bereich") || n.includes("abteilung")) return "department";
      if(n.includes("hierarchie")) return "hierarchy";
      if(n.includes("einfluss")) return "influence";
      if(n.includes("interesse")) return "interest";
      if(n.includes("haltung")) return "attitude";
      if(n.includes("beeinfluss")) return "persuadability";
      if(n.includes("vorgesetz")) return "boss";
      if(n.includes("themen")) return "topics";
      if(n.includes("notiz") || n.includes("hinweis")) return "notes";
      return "other";
    }

    function parseNumber(v){
      const n = Number(String(v).replace(",", "."));
      return Number.isFinite(n) ? n : null;
    }

    function attitudeFactor(txt){
      const t = String(txt || "").toLowerCase();
      if(t.includes("krit") || t.includes("neg")) return 0.75;
      if(t.includes("neutral")) return 1.0;
      if(t.includes("posit")) return 1.15;
      return 1.0;
    }

    function attitudeClass(txt){
      const t = String(txt || "").toLowerCase();
      if(t.includes("krit") || t.includes("neg")) return "kritisch";
      if(t.includes("neutral")) return "neutral";
      return "positiv";
    }

    function fullName(row){
      const n = String(row.name || "").trim();
      if(n) return n;
      return [row.nachname, row.vorname].filter(Boolean).join(", ").replace(/^,\s*/, "").trim();
    }

    function detectHeaderRow(rows){
      for(let i=0;i<Math.min(rows.length, 12); i++){
        const r = rows[i].map(x => normalize(x));
        if(r.some(v => v.includes("einfluss")) && r.some(v => v.includes("interesse"))){
          return i;
        }
      }
      return -1;
    }

    function buildUniqueCodes(list){
      const used = {};
      const map = new Map();

      list.forEach(p => {
        const parts = String(p.name).replace(",", " ").split(/\s+/).filter(Boolean);
        let base = parts.slice(0,2).map(x => x[0] ? x[0].toUpperCase() : "").join("");
        if(!base) base = "ST";
        if(!used[base]) {
          used[base] = 1;
          map.set(p.name, base);
        } else {
          used[base] += 1;
          map.set(p.name, base + used[base]);
        }
      });
      return map;
    }

    function priority(score){
      if(score >= 55) return "A";
      if(score >= 32) return "B";
      return "C";
    }

    function scoreRow(r){
      const infl = parseNumber(r.influence) ?? 1;
      const inter = parseNumber(r.interest) ?? 1;
      const pers = parseNumber(r.persuadability) ?? 1;
      const hierRaw = parseNumber(r.hierarchy);
      const hier = hierRaw == null ? 3 : hierRaw;
      const hierFactor = 6 - hier; // 1 hoch -> 5 ; 5 niedrig -> 1
      return infl * inter * pers * hierFactor * attitudeFactor(r.attitude);
    }

    function processFile(){
      const file = document.getElementById('fileInput').files[0];
      if(!file){ alert("Bitte zuerst eine Excel-Datei auswählen."); return; }

      const reader = new FileReader();
      reader.onload = (e) => {
        try{
          const wb = XLSX.read(e.target.result, {type:"binary"});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
          const headerRow = detectHeaderRow(rows);

          if(headerRow < 0){
            log("❌ Kopfzeile nicht erkannt.");
            return;
          }

          const rawHeaders = rows[headerRow];
          const mappedHeaders = rawHeaders.map(mapHeader);

          const data = [];
          for(let i=headerRow+1; i<rows.length; i++){
            const row = rows[i];
            if(!row || row.every(v => String(v).trim() === "")) continue;
            const obj = {};
            row.forEach((v, idx) => {
              const key = mappedHeaders[idx];
              if(!key || key === "other") return;
              obj[key] = v;
            });
            obj.name = fullName(obj);
            if(obj.name) data.push(obj);
          }

          enriched = data.map(r => ({
            ...r,
            score: scoreRow(r),
            priority: priority(scoreRow(r)),
            attitudeType: attitudeClass(r.attitude),
            influenceNum: parseNumber(r.influence) ?? 1,
            interestNum: parseNumber(r.interest) ?? 1,
            persuadabilityNum: parseNumber(r.persuadability) ?? 1,
            hierarchyNum: parseNumber(r.hierarchy) ?? 3
          })).sort((a,b) => b.score - a.score);

          uniqueCodeMap = buildUniqueCodes(enriched);

          document.getElementById("statTotal").textContent = enriched.length;
          document.getElementById("statA").textContent = enriched.filter(x => x.priority === "A").length;
          document.getElementById("statCritical").textContent =
            enriched.filter(x => x.influenceNum >= 4 && x.attitudeType === "kritisch").length;

          log("✔ Kopfzeile erkannt.");
          log("✔ Stakeholder geladen: " + enriched.length);
          log("✔ Eindeutige Kürzel vergeben.");
        } catch(err){
          log("❌ Fehler beim Einlesen: " + err.message);
        }
      };
      reader.readAsBinaryString(file);
    }

    function topStakeholders(n=10, subset=null){
      const src = subset || enriched;
      return src.slice(0, n);
    }

    function htmlEscape(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
    }

    function renderTopTable(list, limit=10){
      const rows = list.slice(0, limit).map(p => `
        <tr>
          <td class="prio-${p.priority}">${p.priority}</td>
          <td>${htmlEscape(p.name)}</td>
          <td>${htmlEscape(p.role || p.department || "")}</td>
          <td>${Math.round(p.score)}</td>
          <td class="att-${p.attitudeType}">${htmlEscape(p.attitude || p.attitudeType)}</td>
          <td>${htmlEscape(p.topics || "")}</td>
        </tr>
      `).join("");
      return `
        <table>
          <thead>
            <tr>
              <th>Prio</th><th>Name</th><th>Rolle/Bereich</th><th>Score</th><th>Haltung</th><th>Themen</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function summaryText(){
      const aCount = enriched.filter(x => x.priority === "A").length;
      const highInfluence = enriched.filter(x => x.influenceNum >= 4).length;
      const highInterest = enriched.filter(x => x.interestNum >= 4).length;
      const top5 = topStakeholders(5).map(x => x.name).join(", ");
      return `
        <div class="summary">
          <p>Im System liegen aktuell <strong>${aCount} Stakeholder in Priorität A</strong>. Das sind die Personen, die im Workshop aktiv bearbeitet werden sollten.</p>
          <p>Auffällig ist die Kombination aus <strong>${highInfluence} Personen mit Einfluss 4–5</strong> und zugleich <strong>${highInterest} Personen mit hohem Interesse</strong>.</p>
          <p>Die stärksten Hebel liegen derzeit bei <strong>${htmlEscape(top5)}</strong>.</p>
          <p>Ziel für den Workshop: nicht alle Personen gleich behandeln, sondern bewusst zwischen <strong>aktiv bearbeiten</strong>, <strong>stabilisieren</strong> und <strong>beobachten</strong> unterscheiden.</p>
        </div>`;
    }

    function renderSvgQuadrant(list, xKey, yKey, title, xLabel, yLabel, quadrantLabels){
      const displayList = list.filter(p => p.priority !== "C").slice(0, 14);
      const w = 700, h = 420, padL = 64, padB = 44, padT = 26, padR = 20;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const pts = {};
      const items = displayList.map(p => {
        const x = Number(p[xKey] || 1);
        const y = Number(p[yKey] || 1);
        const key = x + "|" + y;
        pts[key] = (pts[key] || 0) + 1;
        const count = pts[key];
        const dx = ((count-1)%3 - 1) * 16;
        const dy = (Math.floor((count-1)/3)) * 16;
        const px = padL + ((x-1)/4) * plotW + dx;
        const py = padT + plotH - ((y-1)/4) * plotH - dy;
        const fill = p.attitudeType === "kritisch" ? "var(--ui-red)" :
                     p.attitudeType === "neutral" ? "var(--ui-yellow)" : "var(--ui-green)";
        const code = uniqueCodeMap.get(p.name) || "ST";
        return {px, py, fill, code, p};
      });

      const legend = displayList.map(p =>
        `<div class="legend-item"><strong>${uniqueCodeMap.get(p.name)}</strong> = ${htmlEscape(p.name)}</div>`
      ).join("");

      const svg = `
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" aria-label="${htmlEscape(title)}">
        <rect x="0" y="0" width="${w}" height="${h}" rx="16" fill="#fff"/>
        <line x1="${padL}" y1="${padT + plotH/2}" x2="${padL + plotW}" y2="${padT + plotH/2}" stroke="#bdd4e5" stroke-width="2"/>
        <line x1="${padL + plotW/2}" y1="${padT}" x2="${padL + plotW/2}" y2="${padT + plotH}" stroke="#bdd4e5" stroke-width="2"/>
        <line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#6d88a1" stroke-width="2"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#6d88a1" stroke-width="2"/>

        <text x="${padL + 10}" y="${padT + 18}" font-size="13" fill="#5f7b93">${htmlEscape(quadrantLabels[0])}</text>
        <text x="${padL + plotW/2 + 10}" y="${padT + 18}" font-size="13" fill="#5f7b93">${htmlEscape(quadrantLabels[1])}</text>
        <text x="${padL + 10}" y="${padT + plotH - 10}" font-size="13" fill="#5f7b93">${htmlEscape(quadrantLabels[2])}</text>
        <text x="${padL + plotW/2 + 10}" y="${padT + plotH - 10}" font-size="13" fill="#5f7b93">${htmlEscape(quadrantLabels[3])}</text>

        <text x="${padL + plotW/2 - 20}" y="${h - 8}" font-size="13" fill="#5f7b93">${htmlEscape(xLabel)}</text>
        <text x="18" y="${padT + plotH/2 + 20}" transform="rotate(-90 18 ${padT + plotH/2 + 20})" font-size="13" fill="#5f7b93">${htmlEscape(yLabel)}</text>

        ${items.map(it => `
          <circle cx="${it.px}" cy="${it.py}" r="17" fill="${it.fill}" opacity="0.92"/>
          <text x="${it.px}" y="${it.py + 4}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${htmlEscape(it.code)}</text>
        `).join("")}
      </svg>`;

      return {
        chart: `<div class="viz-box">${svg}</div>`,
        legend: `<div class="legend-box"><h3>Legende</h3>${legend}</div>`
      };
    }

    function renderOrgChart(){
      const level1 = enriched.filter(x => x.hierarchyNum <= 1.5).slice(0,8);
      const level2 = enriched.filter(x => x.hierarchyNum > 1.5 && x.hierarchyNum <= 3).slice(0,16);
      const level3 = enriched.filter(x => x.hierarchyNum > 3).slice(0,18);

      function node(p){
        const color = p.attitudeType === "kritisch" ? "var(--ui-red)" :
                      p.attitudeType === "neutral" ? "var(--ui-yellow)" : "var(--ui-blue)";
        return `
          <div class="org-node" style="border-left-color:${color}">
            <div class="org-name">${htmlEscape(p.name)}</div>
            <div class="org-role">${htmlEscape(p.role || p.department || "")}</div>
            <div class="org-boss">Vorgesetzt: ${htmlEscape(p.boss || "–")}</div>
          </div>`;
      }

      return `
        <div class="org-grid">
          <div class="org-col">
            <h3>Top-Ebene</h3>
            ${level1.map(node).join("")}
          </div>
          <div class="org-col">
            <h3>mittlere Ebene</h3>
            ${level2.map(node).join("")}
          </div>
          <div class="org-col">
            <h3>operative Ebene</h3>
            ${level3.map(node).join("")}
          </div>
        </div>
        <p class="small" style="margin-top:8mm">Hinweis: Das Organigramm bildet die formale Logik aus Hierarchieebene und Vorgesetztenbezug ab. Es ist keine vollständige Bank-Organisationsgrafik, sondern eine Arbeitsansicht für den Workshop.</p>
      `;
    }

    function bossesSet(){
      return new Set(enriched.map(x => String(x.boss || "").trim()).filter(Boolean));
    }

    function filterByRolePerspective(roleCode){
      const bossNames = bossesSet();
      const keywordMap = {
        SVD: ["steuer", "planung", "governance", "vertriebssteuer", "operativ", "kundencenter"],
        MVD: ["vertrieb", "marktbear", "retail", "fläche", "kundencenter", "aktivierung"],
        VVD: ["vermög", "private banking", "wertpapier", "anlage", "fonds"],
        PVD: ["digital", "projekt", "transformation", "planung", "steuer", "umsetzung"]
      };
      const keys = keywordMap[roleCode] || [];

      let subset = enriched.filter(p => {
        const hay = [p.role, p.department, p.topics, p.notes].join(" ").toLowerCase();
        return keys.some(k => hay.includes(k));
      });

      if(subset.length < 6){
        subset = enriched.slice(0,10);
      }

      subset = subset.filter(p => {
        const isBoss = bossNames.has(p.name);
        return p.priority === "A" || !isBoss;
      });

      const dedup = [];
      const seen = new Set();
      subset.forEach(p => {
        if(!seen.has(p.name)){ seen.add(p.name); dedup.push(p); }
      });
      return dedup.slice(0, 10);
    }

    function renderRolePage(roleCode){
      const subset = filterByRolePerspective(roleCode);
      const viz = renderSvgQuadrant(
        subset,
        "interestNum",
        "influenceNum",
        roleCode + "-Sicht",
        "Interesse",
        "Einfluss",
        ["geringe Aktivierungsrelevanz", "hohe strategische Relevanz", "beobachten", "gezielt einbinden"]
      );
      const focusText = {
        SVD: "Fokus auf Steuerung, Planung, Vertriebssteuerung und operative Anschlussfähigkeit.",
        MVD: "Fokus auf Marktbearbeitung, Fläche, Aktivierung und vertriebliche Multiplikatoren.",
        VVD: "Fokus auf Vermögensberatung, Private Banking, Anlage- und Wertpapiernähe.",
        PVD: "Fokus auf Projekte, Digitalisierung, Veränderung und Umsetzungsfähigkeit im Haus."
      }[roleCode] || "";

      return `
        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">${roleCode} Rollenperspektive</div>
              <div class="page-sub">Erst Gesamtübersicht, jetzt die rollenspezifische Lesart für den Workshop.</div>
            </div>
            <div class="badge">${roleCode}-Perspektive</div>
          </div>
          <div class="role-sub">${focusText}</div>
          <div class="viz-wrap">
            <div>
              ${viz.chart}
              <div style="margin-top:6mm">${renderTopTable(subset, 8)}</div>
            </div>
            ${viz.legend}
          </div>
          <div class="footer-note"><span>Rollenperspektive ${roleCode}</span><span>Version V9 WORKSHOP</span></div>
        </div>`;
    }

    function renderPriorityCards(){
      const list = enriched.filter(x => x.priority === "A").slice(0, 6);
      return `
        <div class="stb-grid">
          ${list.map(p => `
            <div class="stb">
              <h3>${htmlEscape(p.name)}</h3>
              <p><span class="pill">${htmlEscape(p.role || p.department || "")}</span> <span class="pill">Score ${Math.round(p.score)}</span></p>
              <p><strong>Einordnung:</strong> Einfluss ${p.influenceNum}, Interesse ${p.interestNum}, Beeinflussbarkeit ${p.persuadabilityNum}, Haltung ${htmlEscape(p.attitude || p.attitudeType)}.</p>
              <p><strong>Hypothese:</strong> ${p.priority === "A" ? "aktiv bearbeiten und bewusst anschlussfähig halten." : "beobachten und situativ einbinden."}</p>
              <p><strong>Themen:</strong> ${htmlEscape(p.topics || "–")}</p>
              <p><strong>Notizen:</strong> ${htmlEscape(p.notes || "–")}</p>
            </div>`).join("")}
        </div>
      `;
    }

    function preparePdf(){
      if(!enriched.length){
        alert("Bitte erst die Datei prüfen.");
        return;
      }

      const report = document.getElementById('report');
      const matrix = renderSvgQuadrant(
        enriched.slice(0,14),
        "interestNum",
        "influenceNum",
        "Gesamtsicht des Systems",
        "Interesse",
        "Einfluss",
        ["hoher Einfluss / geringes Interesse", "hoher Einfluss / hohes Interesse", "geringer Einfluss / geringes Interesse", "geringer Einfluss / hohes Interesse"]
      );
      const heat = renderSvgQuadrant(
        enriched.slice(0,14),
        "persuadabilityNum",
        "influenceNum",
        "Wo lohnt sich aktiver Energieeinsatz?",
        "Beeinflussbarkeit",
        "Einfluss",
        ["stabilisieren", "aktiv gewinnen", "beobachten", "gezielt entwickeln"]
      );

      report.innerHTML = `
        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">Stakeholder-Landkarte</div>
              <div class="page-sub">Workshop-Report auf Basis der Excel-Datei • erst Gesamtübersicht, dann Rollenperspektiven</div>
            </div>
            <div class="badge">Gesamtübersicht</div>
          </div>

          <div class="three-cards">
            <div class="card"><h3>Stakeholder gesamt</h3><div class="big">${enriched.length}</div></div>
            <div class="card"><h3>Priorität A</h3><div class="big">${enriched.filter(x => x.priority === "A").length}</div></div>
            <div class="card"><h3>Kritische Hoch-Einfluss-Personen</h3><div class="big">${enriched.filter(x => x.influenceNum >= 4 && x.attitudeType === "kritisch").length}</div></div>
          </div>

          <div class="card" style="margin-top:8mm">
            <h3>Worum es im Workshop geht</h3>
            <p style="margin:0; font-size:14px; line-height:1.5">Wir betrachten nicht nur einzelne Personen, sondern ein System aus Einfluss, Interesse, Haltung und Anschlussfähigkeit. Ziel ist nicht Bewertung, sondern eine gemeinsame Lesart: Wer braucht aktive Bearbeitung, wer Stabilisierung und wo reichen Beobachtung und Pflege.</p>
          </div>

          <div class="footer-note"><span>Gesamtübersicht</span><span>Version V9 WORKSHOP</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">Management Summary</div>
              <div class="page-sub">Verdichtung der zentralen Muster für den Workshop.</div>
            </div>
            <div class="badge">Summary</div>
          </div>
          <div class="two-col">
            <div>${summaryText()}</div>
            <div class="card">
              <h3>Top 6 nach Score</h3>
              ${renderTopTable(enriched, 6)}
            </div>
          </div>
          <div class="footer-note"><span>Gesamtübersicht • Summary</span><span>Version V9 WORKSHOP</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">Organigramm</div>
              <div class="page-sub">Formale Logik des Systems aus Hierarchieebene und Vorgesetztenbezug.</div>
            </div>
            <div class="badge">Struktur</div>
          </div>
          ${renderOrgChart()}
          <div class="footer-note"><span>Gesamtübersicht • Organigramm</span><span>Version V9 WORKSHOP</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">Gesamtübersicht • Stakeholder-Matrix</div>
              <div class="page-sub">X = Interesse • Y = Einfluss • Farbe = Haltung</div>
            </div>
            <div class="badge">Matrix</div>
          </div>
          <div class="viz-wrap">${matrix.chart}${matrix.legend}</div>
          <div class="footer-note"><span>Gesamtübersicht • Matrix</span><span>Version V9 WORKSHOP</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">Gesamtübersicht • Heatmap</div>
              <div class="page-sub">X = Beeinflussbarkeit • Y = Einfluss • Farbe = Haltung</div>
            </div>
            <div class="badge">Heatmap</div>
          </div>
          <div class="viz-wrap">${heat.chart}${heat.legend}</div>
          <div class="footer-note"><span>Gesamtübersicht • Heatmap</span><span>Version V9 WORKSHOP</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">Gesamtübersicht • Priorisierung</div>
              <div class="page-sub">A = aktiv bearbeiten • B = gezielt stabilisieren • C = beobachten</div>
            </div>
            <div class="badge">Priorisierung</div>
          </div>
          ${renderTopTable(enriched, 10)}
          <div class="footer-note"><span>Gesamtübersicht • Priorisierung</span><span>Version V9 WORKSHOP</span></div>
        </div>

        ${renderRolePage("SVD")}
        ${renderRolePage("MVD")}
        ${renderRolePage("VVD")}
        ${renderRolePage("PVD")}

        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">A-Prioritäten</div>
              <div class="page-sub">Arbeitssteckbriefe für die aktiv zu bearbeitenden Personen.</div>
            </div>
            <div class="badge">Steckbriefe</div>
          </div>
          ${renderPriorityCards()}
          <div class="footer-note"><span>A-Prioritäten</span><span>Version V9 WORKSHOP</span></div>
        </div>
      `;
      window.print();
    }
  </script>
</body>
</html>
