<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stakeholder Organigramm App</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f5f9fc}
.shell{padding:20px}
.panel{background:#fff;padding:15px;border-radius:12px}
button{padding:10px;margin-top:10px}
#chart{margin-top:20px}
</style>
</head>

<body>

<div class="shell">
<div class="panel">
<h2>Stakeholder Organigramm</h2>

<input type="file" id="fileInput"/>
<button onclick="processFile()">Excel laden</button>
<button onclick="exportPng()">PNG Export</button>

<div id="chart"></div>

</div>
</div>

<script>

let data = [];

function processFile(){
 const file = document.getElementById('fileInput').files[0];
 if(!file){ alert("Bitte Datei wählen"); return; }

 const reader = new FileReader();
 reader.onload = function(e){
   const wb = XLSX.read(e.target.result,{type:'binary'});
   const sheet = wb.Sheets[wb.SheetNames[0]];
   const json = XLSX.utils.sheet_to_json(sheet);

   data = json.map(d => ({
     name: d.Name || d.fullName || "",
     boss: d.Vorgesetzter || "",
     score: Number(d.Score || 0),
     role: d.Rolle || "Sonstige"
   }));

   buildChart();
 };
 reader.readAsBinaryString(file);
}

function buildChart(){

 const rootMap = {};
 data.forEach(d => rootMap[d.name] = {...d, children:[]});

 const roots = [];

 data.forEach(d => {
   if(d.boss && rootMap[d.boss]){
     rootMap[d.boss].children.push(rootMap[d.name]);
   } else {
     roots.push(rootMap[d.name]);
   }
 });

 const root = d3.hierarchy({children:roots});
 const tree = d3.tree().nodeSize([80,200]);
 tree(root);

 const svg = d3.select("#chart").html("").append("svg")
   .attr("width",1200)
   .attr("height",800);

 const g = svg.append("g").attr("transform","translate(100,100)");

 g.selectAll("line")
   .data(root.links())
   .enter()
   .append("line")
   .attr("x1",d=>d.source.y)
   .attr("y1",d=>d.source.x)
   .attr("x2",d=>d.target.y)
   .attr("y2",d=>d.target.x)
   .attr("stroke","#999");

 const node = g.selectAll("g")
   .data(root.descendants())
   .enter()
   .append("g")
   .attr("transform",d=>`translate(${d.y},${d.x})`);

 node.append("circle")
   .attr("r",20)
   .attr("fill",d=> getColor(d.data.score));

 node.append("text")
   .attr("dy",5)
   .attr("text-anchor","middle")
   .text(d=> d.data.name);

}

function getColor(score){
 if(score > 70) return "red";
 if(score > 40) return "orange";
 return "green";
}

async function exportPng(){
 const chart = document.getElementById("chart");
 const canvas = await html2canvas(chart);
 const link = document.createElement("a");
 link.download = "organigramm.png";
 link.href = canvas.toDataURL();
 link.click();
}

</script>

</body>
</html>
