<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KAM Statusbericht</title>

<style>
body{font-family:Arial;background:#f4f8fb;margin:0}
.top{background:#0f4c81;color:#fff;padding:20px}
.page{
width:297mm;
height:210mm;
padding:20mm;
background:#fff;
page-break-after:always;
}
h1,h2{color:#0f4c81}
.highlight{
background:#0f4c81;
color:#fff;
padding:20px;
border-radius:10px;
font-size:22px;
}
.card{
border:1px solid #cfe0ef;
padding:12px;
border-radius:10px;
margin:8px 0;
}
</style>
</head>

<body>

<div class="top">
<h1>KAM Statusbericht</h1>
<p>Systemeinordnung & Steuerungsansatz</p>
</div>

<input type="file" id="file">
<button onclick="load()">Daten laden</button>
<button onclick="build()">PDF erzeugen</button>

<div id="report"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>

let data=[];

function load(){
const file=document.getElementById('file').files[0];
const reader=new FileReader();

reader.onload=function(e){
const wb=XLSX.read(e.target.result,{type:'binary'});
const sheet=wb.Sheets[wb.SheetNames[0]];
const rows=XLSX.utils.sheet_to_json(sheet);

data=rows.map(r=>{
let score=(r.Einfluss||1)*(r.Interesse||1)*(r.Beeinflussbarkeit||1)*(6-(r.Hierarchieebene||3));
return {...r,score};
}).sort((a,b)=>b.score-a.score);

};

reader.readAsBinaryString(file);
}

function top(n){return data.slice(0,n)}

function build(){

let html="";

/* 1 KERNAUSSAGE */
html+=`
<div class="page">
<div class="highlight">
Die Steuerung des Systems konzentriert sich aktuell auf ${top(5).map(x=>x.Name).join(", ")}.
Zwei dieser Positionen sind für die weitere Entwicklung kritisch anschlussfähig zu halten.
</div>
</div>`;

/* 2 SUMMARY */
html+=`
<div class="page">
<h2>Executive Summary</h2>
<div class="card">Das System wird von wenigen, klar identifizierbaren Einflusszentren geprägt.</div>
<div class="card">Mehrere Schlüsselpersonen sind operativ relevant, aber nicht vollständig integriert.</div>
<div class="card">Eine differenzierte Bearbeitung nach Rolle und Einfluss ist erforderlich.</div>
</div>`;

/* 3 MACHT */
html+=`
<div class="page">
<h2>Machtzentren</h2>
${top(6).map(p=>`
<div class="card">
<b>${p.Name}</b><br>
Score ${Math.round(p.score)}<br>
Einfluss ${p.Einfluss}
</div>
`).join("")}
</div>`;

/* 4 KAM */
html+=`
<div class="page">
<h2>KAM Steuerung</h2>
<div class="card">Aktiv entwickeln: ${top(3).map(x=>x.Name).join(", ")}</div>
<div class="card">Stabilisieren: ${data.slice(3,6).map(x=>x.Name).join(", ")}</div>
<div class="card">Indirekt adressieren: ${data.slice(6,10).map(x=>x.Name).join(", ")}</div>
<div class="card">Beobachten: restliche Stakeholder</div>
</div>`;

/* 5 STRUKTUR */
html+=`
<div class="page">
<h2>Struktur</h2>
${data.slice(0,15).map(p=>`
<div class="card">
${p.Name} → ${p.Vorgesetzter||"-"}
</div>
`).join("")}
</div>`;

/* 6 SYSTEM */
html+=`
<div class="page">
<h2>Systemlogik</h2>
<p>Einfluss entsteht nicht ausschließlich über Hierarchie, sondern über funktionale und informelle Verbindungen.</p>
</div>`;

/* 7 TOP */
html+=`
<div class="page">
<h2>Top Stakeholder</h2>
${top(10).map(p=>`
<div class="card">
${p.Name} | Score ${Math.round(p.score)}
</div>
`).join("")}
</div>`;

/* Rollen */
["SVD","MVD","VVD/PVD"].forEach(r=>{
html+=`
<div class="page">
<h2>${r}</h2>
${top(6).map(p=>`
<div class="card">${p.Name}</div>
`).join("")}
</div>`;
});

document.getElementById("report").innerHTML=html;
window.print();
}

</script>

</body>
</html>
