
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KAM V14</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:Arial;background:#f5f9fc;margin:0;padding:20px}
h1{color:#0f4c81}
.box{background:white;padding:15px;border-radius:10px;margin-bottom:15px;border:1px solid #ccc}
button{padding:10px 15px;border:none;border-radius:8px;background:#0f4c81;color:white;font-weight:bold}
.node{border:1px solid #ccc;padding:6px;margin:4px;border-left:5px solid #0f4c81;border-radius:6px}
.dev{border-left-color:#57b884}
.stab{border-left-color:#e8b949}
.obs{border-left-color:#d76a6a}
</style>
</head>
<body>

<h1>KAM Steuerungstool V14</h1>

<div class="box">
<input type="file" id="file">
<button onclick="load()">Analyse</button>
<button onclick="build()">PDF</button>
</div>

<div class="box" id="control">Noch nichts geladen</div>
<div id="report"></div>

<script>
let data=[]

function clean(n){return String(n||"").replace(",", "").trim()}

function classify(score){
if(score>60)return "entwickeln"
if(score>40)return "stabilisieren"
return "beobachten"
}

function load(){
let f=document.getElementById('file').files[0]
let r=new FileReader()

r.onload=e=>{
let wb=XLSX.read(e.target.result,{type:'binary'})
let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]])

data=rows.map(r=>{
let name=clean((r.Vorname||"")+" "+(r.Nachname||""))
let score=(r.Einfluss||1)*(r.Interesse||1)
return {...r,name,score,phase:classify(score)}
})

document.getElementById("control").innerHTML=
"Stakeholder: "+data.length+"<br>"+
"Aktiv entwickeln: "+data.filter(x=>x.phase=="entwickeln").length+"<br>"+
"Stabilisieren: "+data.filter(x=>x.phase=="stabilisieren").length
}

r.readAsBinaryString(f)
}

function build(){

let html="<div class='box'><h2>Steuerungslogik</h2>"

data.forEach(p=>{
let cls=p.phase=="entwickeln"?"dev":p.phase=="stabilisieren"?"stab":"obs"
html+=`<div class="node ${cls}">${p.name} – ${p.phase}</div>`
})

html+="</div>"

document.getElementById("report").innerHTML=html
window.print()
}
</script>

</body>
</html>
