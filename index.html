<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stakeholder PDF Generator V3 FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont;
  margin: 0;
  background: #f5f7fb;
  color: #1c2b4a;
}

.header {
  background: linear-gradient(135deg,#0b1f4d,#1c3a8a);
  color: white;
  padding: 30px;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
}

.container {
  padding: 20px;
}

button {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  margin: 5px 0;
  font-weight: bold;
}

.primary { background:#1c3a8a; color:white; }
.secondary { background:#d0d5dd; }

.log {
  background:#0b1f4d;
  color:white;
  padding:15px;
  border-radius:10px;
  margin-top:20px;
  font-family: monospace;
  font-size:13px;
}
</style>

</head>
<body>

<div class="header">
<h2>PDF Generator Gamma Stil</h2>
<p>Version V3 FINAL</p>
</div>

<div class="container">

<input type="file" id="fileInput"><br>

<button class="primary" onclick="process()">Datei prüfen</button>
<button class="secondary" onclick="createPDF()">PDF erzeugen</button>

<div class="log" id="log">
Bereit. Version Gamma V3 FINAL.
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>

let data = [];

function log(msg){
  document.getElementById("log").innerHTML += "<br>"+msg;
}

function normalize(str){
  return str.toLowerCase().replace(/[^a-zäöüß]/g,"");
}

function process(){
  const file = document.getElementById('fileInput').files[0];
  if(!file){ alert("Datei fehlt"); return;}

  const reader = new FileReader();
  reader.onload = function(e){
    const wb = XLSX.read(e.target.result, {type:"binary"});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1});

    let headerRow = -1;

    for(let i=0;i<rows.length;i++){
      let row = rows[i].map(x=>normalize(String(x)));
      if(row.includes("einfluss") && row.includes("interesse")){
        headerRow = i;
        break;
      }
    }

    if(headerRow === -1){
      log("❌ Kopfzeile nicht gefunden");
      return;
    }

    const headers = rows[headerRow];

    const mapped = headers.map(h=>{
      let n = normalize(String(h));
      if(n.includes("hierarchie")) return "hierarchy";
      if(n.includes("beeinfluss")) return "persuadability";
      if(n.includes("einfluss")) return "influence";
      if(n.includes("interesse")) return "interest";
      if(n.includes("haltung")) return "attitude";
      if(n.includes("name")) return "name";
      return "other";
    });

    data = [];

    for(let i=headerRow+1;i<rows.length;i++){
      let obj = {};
      rows[i].forEach((val,j)=>{
        obj[mapped[j]] = val;
      });
      data.push(obj);
    }

    log("✔ Header erkannt in Zeile "+(headerRow+1));
    log("✔ Stakeholder geladen: "+data.length);
  };

  reader.readAsBinaryString(file);
}

function createPDF(){
  if(data.length===0){
    alert("Erst Datei prüfen");
    return;
  }

  const win = window.open("");
  win.document.write("<h1>Stakeholder Report</h1>");
  win.document.write("<p>Anzahl: "+data.length+"</p>");
  win.print();
}

</script>

</body>
</html>
