<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stakeholder Report V6</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {font-family:-apple-system;margin:0;background:#0f172a;color:#e2e8f0;}
.header {padding:30px;background:#1e293b;}
.container {padding:20px;}
button {padding:12px;border-radius:8px;border:none;margin:5px;}
.primary {background:#3b82f6;color:white;}
.log {background:#020617;padding:10px;border-radius:8px;font-size:12px;}
.page {page-break-after:always;padding:40px;}
h1 {color:white;}
table {width:100%;border-collapse:collapse;}
td,th {border-bottom:1px solid #334155;padding:6px;}
</style>

</head>

<body>

<div class="header">
<h2>Stakeholder Analyse V6</h2>
</div>

<div class="container">
<input type="file" id="fileInput"><br>
<button class="primary" onclick="process()">Datei prüfen</button>
<button class="primary" onclick="createPDF()">PDF erzeugen</button>

<div class="log" id="log">Bereit. V6 FINAL</div>
</div>

<div id="report" style="display:none;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>

let data = [];

function log(t){document.getElementById("log").innerHTML+="<br>"+t;}

function norm(s){return s.toLowerCase().replace(/[^a-zäöüß]/g,"");}

function map(h){
 let n = norm(h);
 if(n.includes("name")) return "name";
 if(n.includes("einfluss")) return "influence";
 if(n.includes("interesse")) return "interest";
 if(n.includes("haltung")) return "attitude";
 if(n.includes("beeinfluss")) return "pers";
 if(n.includes("hierarchie")) return "hier";
 return "other";
}

function process(){
 const f=document.getElementById("fileInput").files[0];
 if(!f) return alert("Datei fehlt");

 const r=new FileReader();
 r.onload=function(e){
  const wb=XLSX.read(e.target.result,{type:"binary"});
  const sh=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sh,{header:1});

  let header=-1;

  for(let i=0;i<rows.length;i++){
   let row=rows[i].map(x=>norm(String(x)));
   if(row.includes("einfluss") && row.includes("interesse")){
    header=i;break;
   }
  }

  const head=rows[header];
  const mapped=head.map(h=>map(h));

  data=[];
  for(let i=header+1;i<rows.length;i++){
   let obj={};
   rows[i].forEach((v,j)=>obj[mapped[j]]=v);
   if(obj.name) data.push(obj);
  }

  data.forEach(d=>{
   let infl=Number(d.influence)||1;
   let inter=Number(d.interest)||1;
   let pers=Number(d.pers)||1;
   let hier=Number(d.hier)||1;
   let att=1;

   if(String(d.attitude).includes("neg")) att=0.7;
   if(String(d.attitude).includes("pos")) att=1.2;

   d.score = infl*inter*pers*(6-hier)*att;
  });

  data.sort((a,b)=>b.score-a.score);

  log("✔ Stakeholder: "+data.length);
  log("✔ Top Score: "+Math.round(data[0].score));
 };

 r.readAsBinaryString(f);
}

function initials(n){
 if(!n) return "";
 return n.split(" ").map(x=>x[0]).join("").toUpperCase();
}

function createPDF(){
 if(data.length==0) return alert("erst prüfen");

 let r=document.getElementById("report");
 r.innerHTML="";
 r.style.display="block";

 function page(title,content){
  return "<div class='page'><h1>"+title+"</h1>"+content+"</div>";
 }

 // Summary
 r.innerHTML+=page("Management Summary",
 "<p>Stakeholder: "+data.length+"</p>"+
 "<p>Top Stakeholder: "+data[0].name+"</p>"
 );

 // Top Tabelle
 let table="<table><tr><th>Name</th><th>Score</th></tr>";
 data.slice(0,10).forEach(d=>{
  table+="<tr><td>"+d.name+"</td><td>"+Math.round(d.score)+"</td></tr>";
 });
 table+="</table>";

 r.innerHTML+=page("Top Stakeholder",table);

 // Matrix simple
 let matrix="<p>Matrix (Einfluss vs Interesse)</p>";
 data.slice(0,20).forEach(d=>{
  matrix+="<p>"+initials(d.name)+" ("+d.influence+"/"+d.interest+")</p>";
 });
 r.innerHTML+=page("Matrix",matrix);

 window.print();
}

</script>

</body>
</html>
