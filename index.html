<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stakeholder Report V7 Workshop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0b1220; --panel:#111827; --panel2:#0f172a; --text:#e5e7eb; --muted:#9ca3af;
    --accent:#60a5fa; --gold:#fbbf24; --green:#34d399; --red:#f87171; --neutral:#94a3b8; --line:#334155;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  .header{padding:28px 32px;background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid var(--line)}
  .header h1{margin:0;font-size:24px}
  .header p{margin:8px 0 0;color:var(--muted)}
  .container{padding:20px 24px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  input[type=file]{padding:10px;background:#fff;border-radius:10px;color:#111}
  button{padding:12px 16px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
  .primary{background:var(--accent);color:#08111f}
  .secondary{background:#1f2937;color:var(--text)}
  .log{margin-top:16px;background:#020617;border:1px solid var(--line);padding:14px;border-radius:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45}
  .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1;font-size:12px;font-weight:700}
  #report{display:none}
  .page{width:297mm;min-height:210mm;background:linear-gradient(180deg,var(--panel),var(--panel2));color:var(--text);padding:18mm 16mm;page-break-after:always;position:relative}
  .page:last-child{page-break-after:auto}
  .page h1{font-size:28px;margin:0 0 10px}
  .page h2{font-size:18px;margin:0 0 8px;color:#dbeafe}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .card{background:rgba(15,23,42,.65);border:1px solid var(--line);border-radius:16px;padding:14px}
  .big{font-size:28px;font-weight:800}
  .small{font-size:12px;color:var(--muted)}
  .summary-list{margin:0;padding-left:18px;line-height:1.5}
  .matrix-wrap{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
  .matrix{position:relative;height:125mm;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:
      linear-gradient(to right, transparent 49.5%, rgba(255,255,255,.12) 50%, transparent 50.5%),
      linear-gradient(to bottom, transparent 49.5%, rgba(255,255,255,.12) 50%, transparent 50.5%),
      linear-gradient(180deg, rgba(96,165,250,.06), rgba(251,191,36,.03));}
  .quad-label{position:absolute;font-size:12px;color:var(--muted);font-weight:700}
  .ql1{top:8px;left:10px}.ql2{top:8px;right:10px}.ql3{bottom:8px;left:10px}.ql4{bottom:8px;right:10px}
  .axis-x,.axis-y{position:absolute;font-size:12px;color:var(--muted);font-weight:700}
  .axis-x{bottom:-22px;left:50%;transform:translateX(-50%)}
  .axis-y{left:-42px;top:50%;transform:translateY(-50%) rotate(-90deg)}
  .dot{position:absolute; transform:translate(-50%,-50%); min-width:28px; height:28px; padding:0 8px;border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;border:1px solid rgba(255,255,255,.18); box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .att-pos{background:rgba(52,211,153,.22); color:#d1fae5}
  .att-neu{background:rgba(148,163,184,.22); color:#e2e8f0}
  .att-neg{background:rgba(248,113,113,.22); color:#fee2e2}
  .legend{background:rgba(15,23,42,.65);border:1px solid var(--line);border-radius:16px;padding:12px}
  .legend h3{margin:0 0 8px;font-size:14px}
  .legend ul{list-style:none;padding:0;margin:0}
  .legend li{font-size:12px;line-height:1.45;padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top}
  th{color:#cbd5e1;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .priority-a{color:#fde68a;font-weight:800}.priority-b{color:#bfdbfe;font-weight:800}.priority-c{color:#cbd5e1;font-weight:800}
  .role-band{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .pill{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}
  .pill.svd{background:#1d4ed8;color:#dbeafe}.pill.mvd{background:#065f46;color:#d1fae5}
  .pill.vvd{background:#7c3aed;color:#ede9fe}.pill.pvd{background:#92400e;color:#fef3c7}
  .foot{position:absolute;right:16mm;bottom:10mm;color:#64748b;font-size:11px}
  .note{font-size:12px;color:#cbd5e1;line-height:1.45}
  @media print{
    body{background:#fff}
    .header,.container{display:none !important}
    #report{display:block !important}
    .page{margin:0;box-shadow:none}
  }
</style>
</head>
<body>
<div class="header">
  <h1>Stakeholder-Analyse V7</h1>
  <p>Workshop-Report • erst Gesamtübersicht, dann Rollenperspektiven für SVD, MVD, VVD und PVD</p>
</div>

<div class="container">
  <div class="row">
    <input type="file" id="fileInput" />
    <button class="primary" onclick="processFile()">Datei prüfen</button>
    <button class="secondary" onclick="buildAndPrint()">PDF erzeugen</button>
    <span class="badge">Version V7 WORKSHOP</span>
  </div>
  <div id="log" class="log">Bereit. Version V7 WORKSHOP.</div>
</div>

<div id="report"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let records = [];
let headersFoundAt = -1;

function log(msg){ document.getElementById('log').innerHTML += "<br>" + msg; }

function norm(s){
  return String(s ?? '').toLowerCase()
    .replace(/[\n\r\t]+/g,' ')
    .replace(/[()]/g,' ')
    .replace(/–|—/g,'-')
    .replace(/[^a-z0-9äöüß -]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function parseNum(v, fallback=1){
  if(v === null || v === undefined || v === '') return fallback;
  const m = String(v).match(/-?\d+/);
  return m ? Number(m[0]) : fallback;
}
function scoreAttitude(v){
  const t = norm(v);
  if(t.includes('posit')) return {factor:1.15, cls:'att-pos', label:'positiv'};
  if(t.includes('krit') || t.includes('neg')) return {factor:0.8, cls:'att-neg', label:'kritisch'};
  return {factor:1.0, cls:'att-neu', label:'neutral'};
}
function mapHeader(h){
  const n = norm(h);
  if(n.includes('vorname')) return 'vorname';
  if(n.includes('nachname')) return 'nachname';
  if(n === 'name' || n.includes('vollname')) return 'name';
  if(n.includes('position') || n.includes('titel') || n === 'rolle') return 'position';
  if(n.includes('abteilung') || n.includes('bereich') || n.includes('funktionseinheit')) return 'bereich';
  if(n.includes('hierarchie')) return 'hierarchie';
  if(n.includes('vorgesetz')) return 'vorgesetzter';
  if(n.includes('einfluss')) return 'einfluss';
  if(n.includes('interesse')) return 'interesse';
  if(n.includes('haltung')) return 'haltung';
  if(n.includes('beeinfluss')) return 'beeinflussbarkeit';
  if(n.includes('themen')) return 'themen';
  if(n.includes('notiz') || n.includes('hinweis')) return 'notizen';
  if(n === 'svd' || n.includes(' svd')) return 'svd';
  if(n === 'mvd' || n.includes(' mvd')) return 'mvd';
  if(n === 'vvd' || n.includes(' vvd')) return 'vvd';
  if(n === 'pvd' || n.includes(' pvd')) return 'pvd';
  return 'other';
}
function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r = (rows[i] || []).map(norm);
    const hit = r.some(x=>x.includes('einfluss')) && r.some(x=>x.includes('interesse'));
    if(hit) return i;
  }
  return -1;
}
function fullName(rec){
  if(rec.name && String(rec.name).trim()) return String(rec.name).trim();
  const fn = String(rec.vorname || '').trim();
  const nn = String(rec.nachname || '').trim();
  return [fn,nn].filter(Boolean).join(' ').trim();
}
function initials(name){
  return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function priority(score, maxScore){
  if(score >= maxScore*0.67) return 'A';
  if(score >= maxScore*0.38) return 'B';
  return 'C';
}
function processFile(){
  const file = document.getElementById('fileInput').files[0];
  if(!file){ alert('Bitte zuerst eine Excel-Datei auswählen.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const sh = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sh, {header:1, defval:''});
      headersFoundAt = findHeaderRow(rows);
      if(headersFoundAt < 0){ log('❌ Kopfzeile nicht gefunden.'); return; }
      const headerMap = rows[headersFoundAt].map(mapHeader);
      records = [];
      for(let i=headersFoundAt+1;i<rows.length;i++){
        const row = rows[i];
        const obj = {};
        row.forEach((val, idx) => { obj[headerMap[idx]] = val; });
        obj.name = fullName(obj);
        if(obj.name){
          obj.einflussNum = parseNum(obj.einfluss, 1);
          obj.interesseNum = parseNum(obj.interesse, 1);
          obj.beeinflussbarkeitNum = parseNum(obj.beeinflussbarkeit, 1);
          obj.hierarchieNum = parseNum(obj.hierarchie, 3);
          obj.att = scoreAttitude(obj.haltung);
          obj.score = Math.round(obj.einflussNum * obj.interesseNum * obj.beeinflussbarkeitNum * (6 - obj.hierarchieNum) * obj.att.factor);
          obj.initials = initials(obj.name);
          records.push(obj);
        }
      }
      records.sort((a,b)=>b.score-a.score);
      log('✔ Kopfzeile erkannt in Zeile ' + (headersFoundAt+1));
      log('✔ Stakeholder geladen: ' + records.length);
      log('✔ Höchster Score: ' + (records[0] ? records[0].score : '-'));
      log('✔ Aufbau: Gesamtübersicht + SVD + MVD + VVD + PVD');
    }catch(err){
      log('❌ Fehler beim Lesen der Datei: ' + err.message);
    }
  };
  reader.readAsBinaryString(file);
}
function uniqueLegend(items){
  const seen = new Set();
  return items.filter(x => {
    let key = x.initials + '|' + x.name;
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });
}
function topByRole(roleKey, count=8){
  const scored = records.map(r => ({...r, roleWeight: parseNum(r[roleKey], 0)}))
    .sort((a,b)=> (b.roleWeight*1000 + b.score) - (a.roleWeight*1000 + a.score));
  const weighted = scored.filter(r => r.roleWeight > 0);
  return (weighted.length ? weighted : scored).slice(0,count);
}
function summaryInsights(){
  const maxScore = records[0]?.score || 1;
  const top = records.slice(0,3);
  const critical = records.filter(r => r.att.label === 'kritisch' && r.einflussNum >=4).slice(0,3);
  const highInfluence = records.filter(r => r.einflussNum >=4).length;
  const highInterest = records.filter(r => r.interesseNum >=4).length;
  const aCount = records.filter(r=>priority(r.score, maxScore)==='A').length;
  const lines = [
    `Im System liegen aktuell <strong>${aCount}</strong> Stakeholder in Priorität A. Das sind die Personen, die im Workshop aktiv bearbeitet werden sollten.`,
    `Auffällig ist die Kombination aus hoher Einflussdichte (${highInfluence} Personen mit Einfluss 4–5) und gleichzeitig ${highInterest} Personen mit hohem Interesse.`,
    top.length ? `Die stärksten Hebel liegen derzeit bei <strong>${escapeHtml(top.map(x=>x.name).join(', '))}</strong>.` : '',
    critical.length ? `Kritisch zu beobachten sind aktuell <strong>${escapeHtml(critical.map(x=>x.name).join(', '))}</strong>, weil hier Einfluss und kritische Haltung zusammenkommen.` : 'Es zeigt sich aktuell kein Block aus mehreren kritischen Hoch-Einfluss-Stakeholdern.',
    `Ziel für den Workshop: nicht alle Personen gleich behandeln, sondern bewusst zwischen aktiv bearbeiten, stabilisieren und beobachten unterscheiden.`
  ].filter(Boolean);
  return `<ul class="summary-list">${lines.map(x=>`<li>${x}</li>`).join('')}</ul>`;
}
function topTable(items){
  const maxScore = records[0]?.score || 1;
  return `<table>
    <tr><th>Priorität</th><th>Name</th><th>Rolle/Bereich</th><th>Score</th><th>Haltung</th><th>Themen</th></tr>
    ${items.map(r=>`
      <tr>
        <td class="priority-${priority(r.score,maxScore).toLowerCase()}">${priority(r.score,maxScore)}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.position || r.bereich || '')}</td>
        <td>${r.score}</td>
        <td>${escapeHtml(r.att.label)}</td>
        <td>${escapeHtml(r.themen || '')}</td>
      </tr>`).join('')}
  </table>`;
}
function matrixHTML(title, items, xKey, yKey, xLabel, yLabel, quadrantLabels){
  const legendItems = uniqueLegend(items);
  const dots = items.map(r=>{
    const x = Math.max(8, Math.min(92, (parseNum(r[xKey],1)-1)/4*84 + 8));
    const y = Math.max(8, Math.min(92, 92 - ((parseNum(r[yKey],1)-1)/4*84 + 8)));
    return `<div class="dot ${r.att.cls}" style="left:${x}%;top:${y}%;" title="${escapeHtml(r.name)}">${escapeHtml(r.initials)}</div>`;
  }).join('');
  return `
    <div class="matrix-wrap">
      <div>
        <h2>${escapeHtml(title)}</h2>
        <div class="matrix">
          <div class="quad-label ql1">${escapeHtml(quadrantLabels[0])}</div>
          <div class="quad-label ql2">${escapeHtml(quadrantLabels[1])}</div>
          <div class="quad-label ql3">${escapeHtml(quadrantLabels[2])}</div>
          <div class="quad-label ql4">${escapeHtml(quadrantLabels[3])}</div>
          <div class="axis-x">${escapeHtml(xLabel)}</div>
          <div class="axis-y">${escapeHtml(yLabel)}</div>
          ${dots}
        </div>
      </div>
      <div class="legend">
        <h3>Legende</h3>
        <ul>${legendItems.map(r=>`<li><strong>${escapeHtml(r.initials)}</strong> = ${escapeHtml(r.name)}</li>`).join('')}</ul>
      </div>
    </div>`;
}
function profileCards(items, heading){
  return `
    <h2>${escapeHtml(heading)}</h2>
    <div class="grid-2">
      ${items.map(r=>`
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div>
            <div style="font-size:18px;font-weight:800">${escapeHtml(r.name)}</div>
            <div class="small">${escapeHtml(r.position || r.bereich || '')}</div>
          </div>
          <div class="big">${r.score}</div>
        </div>
        <div class="note" style="margin-top:10px">
          <strong>Einordnung:</strong> Einfluss ${r.einflussNum}, Interesse ${r.interesseNum}, Beeinflussbarkeit ${r.beeinflussbarkeitNum}, Haltung ${escapeHtml(r.att.label)}.<br>
          <strong>Hypothese für den Workshop:</strong>
          ${r.att.label==='kritisch' ? 'hohen Einfluss aktiv bearbeiten und nicht nur beobachten.' :
            r.einflussNum>=4 ? 'als Hebel und Orientierungspunkt bewusst einbinden.' :
            'eher als Anschluss- und Resonanzpunkt nutzen.'}
          ${r.themen ? '<br><strong>Themen:</strong> ' + escapeHtml(r.themen) : ''}
          ${r.notizen ? '<br><strong>Notizen:</strong> ' + escapeHtml(r.notizen) : ''}
        </div>
      </div>`).join('')}
    </div>`;
}
function page(html, foot='Stakeholder-Analyse V7'){
  return `<section class="page">${html}<div class="foot">${foot}</div></section>`;
}
function buildRolePage(roleKey, roleTitle, pillClass){
  const roleItems = topByRole(roleKey, 8);
  return page(`
    <div class="role-band"><span class="pill ${pillClass}">${roleTitle}</span><span class="small">Rollenperspektive</span></div>
    <h1>${roleTitle} • Fokus</h1>
    <div class="sub">Erst Gesamtübersicht, jetzt die rollenspezifische Lesart für den Workshop</div>
    ${matrixHTML(`${roleTitle}-Sicht`, roleItems, 'interesse', 'einfluss', 'Interesse', 'Einfluss',
      ['geringe Aktivierungsrelevanz','hohe strategische Relevanz','beobachten','gezielt einbinden'])}
    <div class="card" style="margin-top:12px">${topTable(roleItems)}</div>
  `, `${roleTitle}-Perspektive`);
}
function buildAndPrint(){
  if(!records.length){ alert('Bitte zuerst die Datei prüfen.'); return; }
  const report = document.getElementById('report');
  const maxScore = records[0]?.score || 1;
  const overallTop = records.slice(0,10);
  const heatmapTop = records.slice(0,16);
  let html = '';
  html += page(`
    <h1>Stakeholder-Landkarte</h1>
    <div class="sub">Workshop-Report auf Basis der Excel-Datei • erst Gesamtübersicht, dann Rollenperspektiven</div>
    <div class="grid-3">
      <div class="card"><div class="small">Stakeholder gesamt</div><div class="big">${records.length}</div></div>
      <div class="card"><div class="small">Priorität A</div><div class="big">${records.filter(r=>priority(r.score,maxScore)==='A').length}</div></div>
      <div class="card"><div class="small">Kritische Hoch-Einfluss-Personen</div><div class="big">${records.filter(r=>r.att.label==='kritisch' && r.einflussNum>=4).length}</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Worum es im Workshop geht</h2>
      <div class="note">Wir betrachten nicht nur einzelne Personen, sondern ein System aus Einfluss, Interesse, Haltung und Anschlussfähigkeit. Ziel ist nicht Bewertung, sondern eine gemeinsame Lesart: Wer braucht aktive Bearbeitung, wer Stabilisierung und wo reichen Beobachtung und Pflege.</div>
    </div>
  `,'Gesamtübersicht');
  html += page(`
    <h1>Management Summary</h1>
    ${summaryInsights()}
    <div style="margin-top:16px">${topTable(overallTop.slice(0,6))}</div>
  `,'Gesamtübersicht • Summary');
  html += page(`
    <h1>Gesamtübersicht • Stakeholder-Matrix</h1>
    <div class="sub">X = Interesse • Y = Einfluss • Farbe = Haltung</div>
    ${matrixHTML('Gesamtsicht des Systems', records.slice(0,18), 'interesse', 'einfluss', 'Interesse', 'Einfluss',
      ['hoher Einfluss / geringes Interesse','hoher Einfluss / hohes Interesse','geringer Einfluss / geringes Interesse','geringer Einfluss / hohes Interesse'])}
  `,'Gesamtübersicht • Matrix');
  html += page(`
    <h1>Gesamtübersicht • Heatmap</h1>
    <div class="sub">X = Beeinflussbarkeit • Y = Einfluss • Farbe = Haltung</div>
    ${matrixHTML('Wo lohnt sich aktiver Energieeinsatz?', heatmapTop, 'beeinflussbarkeit', 'einfluss', 'Beeinflussbarkeit', 'Einfluss',
      ['stabilisieren','aktiv gewinnen','beobachten','gezielt entwickeln'])}
  `,'Gesamtübersicht • Heatmap');
  html += page(`
    <h1>Gesamtübersicht • Priorisierung</h1>
    <div class="card">${topTable(overallTop)}</div>
    <div class="card" style="margin-top:12px">
      <h2>Lesart für den Workshop</h2>
      <div class="note"><strong>A</strong> = aktiv bearbeiten • <strong>B</strong> = gezielt stabilisieren • <strong>C</strong> = beobachten und bei Bedarf anschließen.</div>
    </div>
  `,'Gesamtübersicht • Priorisierung');
  html += buildRolePage('svd','SVD','svd');
  html += buildRolePage('mvd','MVD','mvd');
  html += buildRolePage('vvd','VVD','vvd');
  html += buildRolePage('pvd','PVD','pvd');
  html += page(profileCards(records.slice(0,6),'Einzelsteckbriefe der A-Prioritäten'),'A-Prioritäten');
  report.innerHTML = html;
  report.style.display = 'block';
  window.print();
}
</script>
</body>
</html>
