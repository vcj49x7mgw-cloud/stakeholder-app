
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KAM Statusbericht V11</title>
<style>
  :root{
    --ui-blue:#0f4c81;
    --ui-blue-2:#1968a5;
    --ui-blue-3:#d9ebf7;
    --ui-bg:#f5f9fc;
    --ui-card:#ffffff;
    --ui-line:#c9dceb;
    --ui-text:#16324a;
    --ui-muted:#5f7b93;
    --ui-green:#57b884;
    --ui-yellow:#e8b949;
    --ui-red:#d76a6a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--ui-bg);color:var(--ui-text)}
  .topbar{background:linear-gradient(135deg,var(--ui-blue),var(--ui-blue-2));color:#fff;padding:24px 20px}
  .topbar h1{margin:0 0 6px 0;font-size:26px}
  .topbar p{margin:0;opacity:.92}
  .wrap{padding:18px;max-width:1200px;margin:0 auto}
  .controls{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(15,76,129,.08)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  input[type=file]{padding:10px;background:#fff;border:1px solid var(--ui-line);border-radius:10px;flex:1 1 320px}
  button{border:none;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
  .btn-primary{background:var(--ui-blue);color:#fff}
  .btn-secondary{background:var(--ui-blue-3);color:var(--ui-text)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
  .stat{background:#fff;border:1px solid var(--ui-line);border-radius:14px;padding:14px}
  .stat .k{font-size:12px;color:var(--ui-muted);margin-bottom:8px}
  .stat .v{font-size:28px;font-weight:800}
  .log{margin-top:14px;background:#fff;border:1px solid var(--ui-line);border-radius:14px;padding:12px 14px;color:var(--ui-text);min-height:92px;white-space:pre-line}
  #report{display:none}
  .page{width:297mm;min-height:210mm;background:#fff;color:var(--ui-text);padding:14mm 14mm 12mm 14mm;page-break-after:always;position:relative}
  .page:last-child{page-break-after:auto}
  .page-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ui-blue-3);padding-bottom:8mm;margin-bottom:8mm}
  .page-title{font-size:24px;line-height:1.1;font-weight:800;color:var(--ui-blue)}
  .page-sub{font-size:12px;color:var(--ui-muted);margin-top:4px}
  .badge{background:var(--ui-blue-3);color:var(--ui-blue);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700}
  .hero{background:linear-gradient(135deg,var(--ui-blue),var(--ui-blue-2));color:#fff;padding:16px 18px;border-radius:18px;font-size:22px;line-height:1.35;font-weight:800}
  .three-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
  .card{background:#fff;border:1px solid var(--ui-line);border-radius:14px;padding:14px}
  .card h3{margin:0 0 8px 0;color:var(--ui-blue);font-size:15px}
  .small{font-size:12px;color:var(--ui-muted)}
  .big{font-size:30px;font-weight:800}
  .summary p{margin:0 0 8px 0;font-size:15px;line-height:1.4}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--ui-blue);border-bottom:2px solid var(--ui-line);padding:8px 6px}
  td{border-bottom:1px solid #e6eef5;padding:7px 6px;vertical-align:top}
  .prio-A{font-weight:800;color:var(--ui-blue)}
  .prio-B{font-weight:700;color:#7a5c15}
  .prio-C{font-weight:700;color:var(--ui-muted)}
  .viz-wrap{display:grid;grid-template-columns:1.2fr .7fr;gap:8mm;align-items:start}
  .viz-box,.legend-box{border:1px solid var(--ui-line);border-radius:16px;padding:12px;background:#fff}
  .legend-box h3{margin:0 0 8px 0;color:var(--ui-blue)}
  .legend-item{font-size:12px;line-height:1.45;margin-bottom:3px}
  .org-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
  .org-col h3{margin:0 0 8px 0;color:var(--ui-blue);font-size:15px}
  .org-node{border:1px solid var(--ui-line);border-left:6px solid var(--ui-blue);border-radius:12px;padding:10px 11px;margin-bottom:6px;background:#fff}
  .org-name{font-weight:800;margin-bottom:3px}
  .org-role{font-size:12px;color:var(--ui-muted)}
  .org-boss{font-size:11px;color:var(--ui-muted);margin-top:4px}
  .footer-note{position:absolute;bottom:8mm;left:14mm;right:14mm;color:var(--ui-muted);font-size:10px;display:flex;justify-content:space-between}
  .pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:#eef6fb;color:var(--ui-blue)}
  .att-positiv{color:var(--ui-green);font-weight:700}
  .att-neutral{color:var(--ui-yellow);font-weight:700}
  .att-kritisch{color:var(--ui-red);font-weight:700}
  .stb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7mm}
  .stb{border:1px solid var(--ui-line);border-radius:16px;padding:12px;background:#fff;min-height:68mm}
  .stb h3{margin:0 0 6px 0;color:var(--ui-blue)}
  .stb p{margin:0 0 6px 0;font-size:12px;line-height:1.4}
  @page{size:A4 landscape;margin:0}
  @media print{
    body{background:#fff}
    .topbar,.wrap{display:none!important}
    #report{display:block!important}
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>KAM Statusbericht V11</h1>
    <p>Statusbericht aus Sicht des Key Account Managements • Gesamtübersicht, Organigramm und Rollenperspektiven</p>
  </div>

  <div class="wrap">
    <div class="controls">
      <div class="row">
        <input id="fileInput" type="file" accept=".xlsx,.xls" />
        <button class="btn-primary" onclick="processFile()">Datei prüfen</button>
        <button class="btn-secondary" onclick="preparePdf()">PDF erzeugen</button>
      </div>

      <div class="stats">
        <div class="stat"><div class="k">Stakeholder gesamt</div><div class="v" id="statTotal">–</div></div>
        <div class="stat"><div class="k">Priorität A</div><div class="v" id="statA">–</div></div>
        <div class="stat"><div class="k">Kritische Hoch-Einfluss-Personen</div><div class="v" id="statCritical">–</div></div>
        <div class="stat"><div class="k">Version</div><div class="v" style="font-size:18px">V11 FINAL</div></div>
      </div>

      <div class="log" id="log">Bereit. Version V11 FINAL.</div>
    </div>
  </div>

  <div id="report"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    let enriched = [];
    let uniqueCodeMap = new Map();

    const logEl = document.getElementById('log');
    const log = (msg) => { logEl.textContent += "\\n" + msg; };

    function normalize(s){
      return String(s || "")
        .toLowerCase()
        .replace(/[–—]/g, "-")
        .replace(/[^a-z0-9äöüß]/g, "");
    }

    function mapHeader(raw){
      const n = normalize(raw);
      if(n.includes("vorname")) return "vorname";
      if(n.includes("nachname")) return "nachname";
      if(n === "name" || n.includes("vollname")) return "name";
      if(n.includes("position") || n.includes("titel") || n.includes("rolle")) return "role";
      if(n.includes("bereich") || n.includes("abteilung")) return "department";
      if(n.includes("hierarchie")) return "hierarchy";
      if(n.includes("einfluss")) return "influence";
      if(n.includes("interesse")) return "interest";
      if(n.includes("haltung")) return "attitude";
      if(n.includes("beeinfluss")) return "persuadability";
      if(n.includes("vorgesetz")) return "boss";
      if(n.includes("themen")) return "topics";
      if(n.includes("notiz") || n.includes("hinweis")) return "notes";
      return "other";
    }

    function parseNumber(v){
      const n = Number(String(v).replace(",", "."));
      return Number.isFinite(n) ? n : null;
    }

    function attitudeFactor(txt){
      const t = String(txt || "").toLowerCase();
      if(t.includes("krit") || t.includes("neg")) return 0.75;
      if(t.includes("neutral")) return 1.0;
      if(t.includes("posit")) return 1.15;
      return 1.0;
    }

    function attitudeClass(txt){
      const t = String(txt || "").toLowerCase();
      if(t.includes("krit") || t.includes("neg")) return "kritisch";
      if(t.includes("neutral")) return "neutral";
      return "positiv";
    }

    function cleanNameParts(text){
      return String(text || "")
        .split(/[;,/]/)
        .map(x => x.trim())
        .filter(Boolean);
    }

    function fullName(row){
      if(String(row.name || "").trim()) return String(row.name).trim();
      const parts = [];
      if(String(row.vorname || "").trim()) parts.push(String(row.vorname).trim());
      if(String(row.nachname || "").trim()) parts.push(String(row.nachname).trim());
      if(parts.length) return parts.join(" ");
      return "";
    }

    function detectHeaderRow(rows){
      for(let i=0;i<Math.min(rows.length, 12); i++){
        const r = rows[i].map(x => normalize(x));
        if(r.some(v => v.includes("einfluss")) && r.some(v => v.includes("interesse"))){
          return i;
        }
      }
      return -1;
    }

    function buildUniqueCodes(list){
      const used = {};
      const map = new Map();
      list.forEach(p => {
        const parts = String(p.name).split(/\s+/).filter(Boolean);
        let base = parts.slice(0,2).map(x => x[0] ? x[0].toUpperCase() : "").join("");
        if(!base) base = "ST";
        if(!used[base]) {
          used[base] = 1;
          map.set(p.name, base);
        } else {
          used[base] += 1;
          map.set(p.name, base + used[base]);
        }
      });
      return map;
    }

    function priority(score){
      if(score >= 55) return "A";
      if(score >= 32) return "B";
      return "C";
    }

    function scoreRow(r){
      const infl = parseNumber(r.influence) ?? 1;
      const inter = parseNumber(r.interest) ?? 1;
      const pers = parseNumber(r.persuadability) ?? 1;
      const hierRaw = parseNumber(r.hierarchy);
      const hier = hierRaw == null ? 3 : hierRaw;
      const hierFactor = 6 - hier;
      return infl * inter * pers * hierFactor * attitudeFactor(r.attitude);
    }

    function processFile(){
      const file = document.getElementById('fileInput').files[0];
      if(!file){ alert("Bitte zuerst eine Excel-Datei auswählen."); return; }

      const reader = new FileReader();
      reader.onload = (e) => {
        try{
          const wb = XLSX.read(e.target.result, {type:"binary"});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
          const headerRow = detectHeaderRow(rows);

          if(headerRow < 0){
            log("❌ Kopfzeile nicht erkannt.");
            return;
          }

          const rawHeaders = rows[headerRow];
          const mappedHeaders = rawHeaders.map(mapHeader);
          const data = [];

          for(let i=headerRow+1; i<rows.length; i++){
            const row = rows[i];
            if(!row || row.every(v => String(v).trim() === "")) continue;
            const obj = {};
            row.forEach((v, idx) => {
              const key = mappedHeaders[idx];
              if(!key || key === "other") return;
              obj[key] = v;
            });
            obj.name = fullName(obj);
            if(obj.name) data.push(obj);
          }

          enriched = data.map(r => ({
            ...r,
            score: scoreRow(r),
            priority: priority(scoreRow(r)),
            attitudeType: attitudeClass(r.attitude),
            influenceNum: parseNumber(r.influence) ?? 1,
            interestNum: parseNumber(r.interest) ?? 1,
            persuadabilityNum: parseNumber(r.persuadability) ?? 1,
            hierarchyNum: parseNumber(r.hierarchy) ?? 3
          })).sort((a,b) => b.score - a.score);

          uniqueCodeMap = buildUniqueCodes(enriched);

          document.getElementById("statTotal").textContent = enriched.length;
          document.getElementById("statA").textContent = enriched.filter(x => x.priority === "A").length;
          document.getElementById("statCritical").textContent =
            enriched.filter(x => x.influenceNum >= 4 && x.attitudeType === "kritisch").length;

          log("✔ Kopfzeile erkannt.");
          log("✔ Stakeholder geladen: " + enriched.length);
          log("✔ Eindeutige Kürzel vergeben.");
        } catch(err){
          log("❌ Fehler beim Einlesen: " + err.message);
        }
      };
      reader.readAsBinaryString(file);
    }

    function htmlEscape(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
    }

    function renderTopTable(list, limit=10){
      const rows = list.slice(0, limit).map(p => `
        <tr>
          <td class="prio-${p.priority}">${p.priority}</td>
          <td>${htmlEscape(p.name)}</td>
          <td>${htmlEscape(p.role || p.department || "")}</td>
          <td>${Math.round(p.score)}</td>
          <td class="att-${p.attitudeType}">${htmlEscape(p.attitude || p.attitudeType)}</td>
          <td>${htmlEscape(p.topics || "")}</td>
        </tr>
      `).join("");
      return `
        <table>
          <thead><tr><th>Prio</th><th>Name</th><th>Rolle/Bereich</th><th>Score</th><th>Haltung</th><th>Themen</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function summaryText(){
      const aCount = enriched.filter(x => x.priority === "A").length;
      const highInfluence = enriched.filter(x => x.influenceNum >= 4).length;
      const highInterest = enriched.filter(x => x.interestNum >= 4).length;
      const top5 = enriched.slice(0,5).map(x => x.name).join(", ");
      return `
        <div class="summary">
          <p>Aktuell liegen <strong>${aCount} Stakeholder in Priorität A</strong>. Diese Personen sind aus Sicht des Key Account Managements primär bearbeitungsrelevant.</p>
          <p>Die Gesamtsicht zeigt <strong>${highInfluence} Personen mit Einfluss 4–5</strong> und zugleich <strong>${highInterest} Personen mit hohem Interesse</strong>.</p>
          <p>Die stärksten Hebel liegen derzeit bei <strong>${htmlEscape(top5)}</strong>.</p>
          <p>Für die weitere Steuerung ist eine klare Trennung zwischen <strong>aktiver Entwicklung</strong>, <strong>Stabilisierung</strong> und <strong>Beobachtung</strong> erforderlich.</p>
        </div>`;
    }

    function renderOrgChart(){
      const level1 = enriched.filter(x => x.hierarchyNum <= 1.5).slice(0,8);
      const level2 = enriched.filter(x => x.hierarchyNum > 1.5 && x.hierarchyNum <= 3).slice(0,16);
      const level3 = enriched.filter(x => x.hierarchyNum > 3).slice(0,18);

      function node(p){
        const color = p.attitudeType === "kritisch" ? "var(--ui-red)" :
                      p.attitudeType === "neutral" ? "var(--ui-yellow)" : "var(--ui-blue)";
        return `
          <div class="org-node" style="border-left-color:${color}">
            <div class="org-name">${htmlEscape(p.name)}</div>
            <div class="org-role">${htmlEscape(p.role || p.department || "")}</div>
            <div class="org-boss">Vorgesetzt: ${htmlEscape(p.boss || "–")}</div>
          </div>`;
      }

      return `
        <div class="org-grid">
          <div class="org-col"><h3>Top-Ebene</h3>${level1.map(node).join("")}</div>
          <div class="org-col"><h3>mittlere Ebene</h3>${level2.map(node).join("")}</div>
          <div class="org-col"><h3>operative Ebene</h3>${level3.map(node).join("")}</div>
        </div>
        <p class="small" style="margin-top:8mm">Die Darstellung zeigt die formale Struktur auf Basis von Hierarchieebene und Vorgesetztenbezug. Sie dient als Arbeitsbild des betreuungsrelevanten Systems.</p>`;
    }

    function filterByRolePerspective(roleCode){
      const keywordMap = {
        SVD: ["steuer", "planung", "governance", "vertriebssteuer", "operativ", "kundencenter"],
        MVD: ["vertrieb", "marktbear", "retail", "fläche", "kundencenter", "aktivierung"],
        VVD: ["vermög", "private banking", "wertpapier", "anlage", "fonds"],
        PVD: ["digital", "projekt", "transformation", "planung", "steuer", "umsetzung"]
      };
      const keys = keywordMap[roleCode] || [];
      let subset = enriched.filter(p => {
        const hay = [p.role, p.department, p.topics, p.notes].join(" ").toLowerCase();
        return keys.some(k => hay.includes(k));
      });
      if(subset.length < 6) subset = enriched.slice(0,10);
      const dedup = [];
      const seen = new Set();
      subset.forEach(p => { if(!seen.has(p.name)){ seen.add(p.name); dedup.push(p); }});
      return dedup.slice(0, 10);
    }

    function renderRolePage(roleCode){
      const subset = filterByRolePerspective(roleCode);
      const focusText = {
        SVD: "Fokus auf Steuerung, Planung, Vertriebssteuerung und operative Anschlussfähigkeit.",
        MVD: "Fokus auf Marktbearbeitung, Fläche, Aktivierung und vertriebliche Multiplikatoren.",
        VVD: "Fokus auf Vermögensberatung, Private Banking, Anlage- und Wertpapiernähe.",
        PVD: "Fokus auf Projekte, Digitalisierung, Veränderung und Umsetzungsfähigkeit."
      }[roleCode] || "";
      return `
        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">${roleCode} – Status aus KAM-Sicht</div>
              <div class="page-sub">${focusText}</div>
            </div>
            <div class="badge">${roleCode}</div>
          </div>
          ${renderTopTable(subset, 8)}
          <div class="footer-note"><span>Rollenperspektive ${roleCode}</span><span>Version V11 FINAL</span></div>
        </div>`;
    }

    function renderPriorityCards(){
      const list = enriched.filter(x => x.priority === "A").slice(0, 6);
      return `
        <div class="stb-grid">
          ${list.map(p => `
            <div class="stb">
              <h3>${htmlEscape(p.name)}</h3>
              <p><span class="pill">${htmlEscape(p.role || p.department || "")}</span> <span class="pill">Score ${Math.round(p.score)}</span></p>
              <p><strong>Einordnung:</strong> Einfluss ${p.influenceNum}, Interesse ${p.interestNum}, Beeinflussbarkeit ${p.persuadabilityNum}, Haltung ${htmlEscape(p.attitude || p.attitudeType)}.</p>
              <p><strong>KAM-Ableitung:</strong> ${p.priority === "A" ? "aktive Bearbeitung mit klarer Anschlusslogik." : "situative Beobachtung."}</p>
              <p><strong>Themen:</strong> ${htmlEscape(p.topics || "–")}</p>
              <p><strong>Notizen:</strong> ${htmlEscape(p.notes || "–")}</p>
            </div>`).join("")}
        </div>`;
    }

    function preparePdf(){
      if(!enriched.length){
        alert("Bitte erst die Datei prüfen.");
        return;
      }

      const report = document.getElementById('report');
      report.innerHTML = `
        <div class="page">
          <div class="page-header">
            <div>
              <div class="page-title">KAM Statusbericht</div>
              <div class="page-sub">Statusbericht aus Sicht des Key Account Managements</div>
            </div>
            <div class="badge">Gesamtübersicht</div>
          </div>
          <div class="hero">
            Die Steuerung des betreuungsrelevanten Systems konzentriert sich aktuell auf ${htmlEscape(enriched.slice(0,5).map(x => x.name).join(", "))}. Aus KAM-Sicht ist eine differenzierte Bearbeitung dieser Schlüsselpositionen erforderlich.
          </div>
          <div class="three-cards" style="margin-top:8mm">
            <div class="card"><h3>Stakeholder gesamt</h3><div class="big">${enriched.length}</div></div>
            <div class="card"><h3>Priorität A</h3><div class="big">${enriched.filter(x => x.priority === "A").length}</div></div>
            <div class="card"><h3>Kritische Hoch-Einfluss-Personen</h3><div class="big">${enriched.filter(x => x.influenceNum >= 4 && x.attitudeType === "kritisch").length}</div></div>
          </div>
          <div class="footer-note"><span>Gesamtübersicht</span><span>Version V11 FINAL</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div><div class="page-title">Executive Summary</div><div class="page-sub">Verdichtung der zentralen Muster aus KAM-Sicht.</div></div>
            <div class="badge">Summary</div>
          </div>
          ${summaryText()}
          <div style="margin-top:6mm">${renderTopTable(enriched, 6)}</div>
          <div class="footer-note"><span>Executive Summary</span><span>Version V11 FINAL</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div><div class="page-title">KAM-Steuerung</div><div class="page-sub">Steuerungslogik für die weitere Bearbeitung.</div></div>
            <div class="badge">Steuerung</div>
          </div>
          <div class="card"><h3>aktiv entwickeln</h3><p style="margin:0">${htmlEscape(enriched.slice(0,3).map(x => x.name).join(", "))}</p></div>
          <div class="card"><h3>stabilisieren</h3><p style="margin:0">${htmlEscape(enriched.slice(3,6).map(x => x.name).join(", "))}</p></div>
          <div class="card"><h3>indirekt adressieren</h3><p style="margin:0">${htmlEscape(enriched.slice(6,10).map(x => x.name).join(", "))}</p></div>
          <div class="card"><h3>beobachten</h3><p style="margin:0">übrige Stakeholder mit niedrigerer Priorität und begrenztem Hebel.</p></div>
          <div class="footer-note"><span>KAM-Steuerung</span><span>Version V11 FINAL</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div><div class="page-title">Organigramm</div><div class="page-sub">Formale Struktur des betreuungsrelevanten Systems.</div></div>
            <div class="badge">Struktur</div>
          </div>
          ${renderOrgChart()}
          <div class="footer-note"><span>Organigramm</span><span>Version V11 FINAL</span></div>
        </div>

        <div class="page">
          <div class="page-header">
            <div><div class="page-title">Top Stakeholder</div><div class="page-sub">Die aktuell wichtigsten Positionen mit direkter Relevanz für die Betreuung.</div></div>
            <div class="badge">Top 10</div>
          </div>
          ${renderTopTable(enriched, 10)}
          <div class="footer-note"><span>Top Stakeholder</span><span>Version V11 FINAL</span></div>
        </div>
